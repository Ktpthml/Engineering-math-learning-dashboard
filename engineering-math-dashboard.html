<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Math Progress Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .modules-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .modules-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .module-card {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .module-card:hover {
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
            transform: translateX(5px);
        }

        .module-card.completed {
            border-left-color: #10b981;
            background: #ecfdf5;
        }

        .module-card.in-progress {
            border-left-color: #f59e0b;
            background: #fffbeb;
        }

        .module-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .module-title {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .module-number {
            background: #667eea;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9em;
        }

        .module-name {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
        }

        .module-status {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-not-started {
            background: #e5e7eb;
            color: #666;
        }

        .status-in-progress {
            background: #fbbf24;
            color: #78350f;
        }

        .status-completed {
            background: #86efac;
            color: #166534;
        }

        .progress-bar-container {
            background: #e5e7eb;
            border-radius: 10px;
            height: 8px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        .module-details {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #d1d5db;
        }

        .module-details.expanded {
            display: block;
        }

        .checklist {
            list-style: none;
            margin-bottom: 15px;
        }

        .checklist li {
            padding: 8px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .checkbox:checked + label {
            color: #10b981;
            text-decoration: line-through;
        }

        .checklist label {
            cursor: pointer;
            flex: 1;
        }

        .notes-section {
            background: #fef3c7;
            border-left: 3px solid #f59e0b;
            padding: 12px;
            border-radius: 4px;
            margin-top: 10px;
        }

        .notes-section label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #92400e;
        }

        .notes-section textarea {
            width: 100%;
            min-height: 80px;
            padding: 10px;
            border: 1px solid #fcd34d;
            border-radius: 4px;
            font-family: inherit;
            resize: vertical;
        }

        .overall-progress {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .progress-section {
            margin-bottom: 25px;
        }

        .progress-section h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .large-progress-bar {
            background: #e5e7eb;
            border-radius: 10px;
            height: 30px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .large-progress-bar .progress-bar {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.9em;
        }

        .progress-text {
            color: #666;
            font-size: 0.95em;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        .milestone {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
        }

        .milestone h4 {
            font-size: 1.2em;
            margin-bottom: 5px;
        }

        .expand-btn {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-size: 1.5em;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .expand-btn.expanded {
            transform: rotate(180deg);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .module-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .module-status {
                margin-top: 10px;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📐 Engineering Math Progress Dashboard</h1>
            <p>Track your journey from basic arithmetic to engineering-ready mathematics</p>
            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-number" id="completedCount">0</span>
                    <span class="stat-label">Modules Completed</span>
                </div>
                <div class="stat-box">
                    <span class="stat-number" id="inProgressCount">0</span>
                    <span class="stat-label">In Progress</span>
                </div>
                <div class="stat-box">
                    <span class="stat-number" id="totalPractice">0</span>
                    <span class="stat-label">Practice Items Done</span>
                </div>
                <div class="stat-box">
                    <span class="stat-number" id="overallPercent">0%</span>
                    <span class="stat-label">Overall Progress</span>
                </div>
            </div>
        </div>

        <div class="overall-progress">
            <div class="progress-section">
                <h3>Overall Course Progress</h3>
                <div class="large-progress-bar">
                    <div class="progress-bar" id="overallBar" style="width: 0%">0%</div>
                </div>
                <p class="progress-text"><span id="progressDetail">Start your first module!</span></p>
            </div>
        </div>

        <div class="modules-section">
            <h2>📚 Modules</h2>
            <div id="modulesContainer"></div>
            <div class="action-buttons">
                <button class="btn-primary" onclick="downloadProgress()">💾 Download Progress</button>
                <button class="btn-secondary" onclick="resetProgress()">🔄 Reset All Progress</button>
            </div>
        </div>
    </div>

    <script>
        const modules = [
            {
                id: 1,
                name: "Algebra Fundamentals",
                description: "Variables, equations, order of operations, fractions, solving linear equations",
                topics: [
                    "Variables and Equations",
                    "Order of Operations (PEMDAS)",
                    "Fractions and Decimals",
                    "Solving Linear Equations"
                ],
                practiceItems: [
                    "Practice problem set 1",
                    "Practice problem set 2",
                    "Practice problem set 3",
                    "Quiz yourself"
                ]
            },
            {
                id: 2,
                name: "Exponents and Roots",
                description: "Powers, exponent rules, square roots, cube roots, scientific notation",
                topics: [
                    "Exponents (Powers)",
                    "Square Roots and Cube Roots",
                    "Scientific Notation",
                    "Exponent Rules"
                ],
                practiceItems: [
                    "Calculate exponents",
                    "Simplify expressions",
                    "Scientific notation problems",
                    "Mixed practice"
                ]
            },
            {
                id: 3,
                name: "Functions and Graphs",
                description: "Functions, linear functions, quadratic functions, graphing",
                topics: [
                    "What is a Function",
                    "Linear Functions",
                    "Quadratic Functions",
                    "Graphing and Reading Graphs"
                ],
                practiceItems: [
                    "Evaluate functions",
                    "Find slope and intercept",
                    "Quadratic formula practice",
                    "Graphing exercises"
                ]
            },
            {
                id: 4,
                name: "Trigonometry Basics",
                description: "Right triangles, SOHCAHTOA, trig ratios, angles",
                topics: [
                    "Right Triangles and SOHCAHTOA",
                    "Finding Angles and Sides",
                    "Important Angles (30, 45, 60 degrees)",
                    "Real-world applications"
                ],
                practiceItems: [
                    "Calculate sin, cos, tan",
                    "Find missing sides",
                    "Find missing angles",
                    "Word problems"
                ]
            },
            {
                id: 5,
                name: "Geometry",
                description: "Areas, perimeters, volumes, Pythagorean theorem",
                topics: [
                    "Areas and Perimeters",
                    "Volumes",
                    "Pythagorean Theorem",
                    "3D Shapes"
                ],
                practiceItems: [
                    "Calculate areas",
                    "Calculate volumes",
                    "Pythagorean theorem problems",
                    "Mixed geometry problems"
                ]
            },
            {
                id: 6,
                name: "Intro to Calculus",
                description: "Rates of change, derivatives, integration basics",
                topics: [
                    "Rates of Change",
                    "Average Rate of Change",
                    "Introduction to Derivatives",
                    "Introduction to Integration"
                ],
                practiceItems: [
                    "Calculate rates",
                    "Apply power rule",
                    "Understand derivatives",
                    "Integration concepts"
                ]
            },
            {
                id: 7,
                name: "Practical Engineering Applications",
                description: "Unit conversions, F=ma, work, energy, electrical basics",
                topics: [
                    "Unit Conversions",
                    "Force, Mass, and Acceleration",
                    "Work and Energy",
                    "Electrical Engineering Basics"
                ],
                practiceItems: [
                    "Convert units",
                    "F = ma problems",
                    "Power calculations",
                    "Ohm's Law problems"
                ]
            },
            {
                id: 8,
                name: "Vectors",
                description: "Vector basics, magnitude, direction, adding vectors",
                topics: [
                    "What is a Vector",
                    "Vector Magnitude",
                    "Adding Vectors",
                    "Practical Applications"
                ],
                practiceItems: [
                    "Calculate magnitudes",
                    "Add vectors",
                    "Find components",
                    "Mixed vector problems"
                ]
            }
        ];

        // Load data from localStorage
        function loadProgress() {
            const saved = localStorage.getItem('engineeringMathProgress');
            return saved ? JSON.parse(saved) : {};
        }

        function saveProgress() {
            localStorage.setItem('engineeringMathProgress', JSON.stringify(progress));
            updateDashboard();
        }

        let progress = loadProgress();

        // Initialize module progress
        modules.forEach(module => {
            if (!progress[module.id]) {
                progress[module.id] = {
                    status: 'not-started',
                    completedTopics: [],
                    completedPractice: [],
                    notes: ''
                };
            }
        });

        function renderModules() {
            const container = document.getElementById('modulesContainer');
            container.innerHTML = '';

            modules.forEach(module => {
                const moduleData = progress[module.id];
                const allPracticeCompleted = moduleData.completedPractice.length === module.practiceItems.length;
                const allTopicsCompleted = moduleData.completedTopics.length === module.topics.length;
                
                // Auto-update status
                if (allPracticeCompleted && allTopicsCompleted) {
                    moduleData.status = 'completed';
                } else if (moduleData.completedTopics.length > 0 || moduleData.completedPractice.length > 0) {
                    moduleData.status = 'in-progress';
                }

                const statusClass = moduleData.status;
                const isExpanded = moduleData.expanded || false;
                
                const card = document.createElement('div');
                card.className = `module-card ${statusClass}`;
                
                const topicProgress = moduleData.completedTopics.length;
                const practiceProgress = moduleData.completedPractice.length;
                const totalItems = module.topics.length + module.practiceItems.length;
                const completionPercent = Math.round((topicProgress + practiceProgress) / totalItems * 100);

                card.innerHTML = `
                    <div class="module-header" style="cursor: pointer;" onclick="toggleModule(${module.id})">
                        <div class="module-title">
                            <div class="module-number">${module.id}</div>
                            <div>
                                <div class="module-name">${module.name}</div>
                                <p style="font-size: 0.9em; color: #666; margin-top: 3px;">${module.description}</p>
                            </div>
                        </div>
                        <div class="module-status">
                            <span class="status-badge status-${statusClass}">${statusClass.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ')}</span>
                            <button class="expand-btn ${isExpanded ? 'expanded' : ''}" style="pointer-events: none;">▼</button>
                        </div>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: ${completionPercent}%"></div>
                    </div>
                    <p style="font-size: 0.85em; color: #666; margin-top: 5px;">${completionPercent}% - ${topicProgress + practiceProgress}/${totalItems} items completed</p>
                    <div class="module-details ${isExpanded ? 'expanded' : ''}" id="details-${module.id}">
                        <h4 style="color: #667eea; margin-bottom: 10px;">Topics</h4>
                        <ul class="checklist">
                            ${module.topics.map((topic, idx) => `
                                <li>
                                    <input type="checkbox" id="topic-${module.id}-${idx}" class="checkbox" 
                                        ${moduleData.completedTopics.includes(idx) ? 'checked' : ''}
                                        onchange="toggleTopic(${module.id}, ${idx})">
                                    <label for="topic-${module.id}-${idx}">${topic}</label>
                                </li>
                            `).join('')}
                        </ul>

                        <h4 style="color: #667eea; margin-bottom: 10px; margin-top: 15px;">Practice Items</h4>
                        <ul class="checklist">
                            ${module.practiceItems.map((item, idx) => `
                                <li>
                                    <input type="checkbox" id="practice-${module.id}-${idx}" class="checkbox" 
                                        ${moduleData.completedPractice.includes(idx) ? 'checked' : ''}
                                        onchange="togglePractice(${module.id}, ${idx})">
                                    <label for="practice-${module.id}-${idx}">${item}</label>
                                </li>
                            `).join('')}
                        </ul>

                        <div class="notes-section">
                            <label for="notes-${module.id}">📝 Your Notes for this Module</label>
                            <textarea id="notes-${module.id}" placeholder="Write any difficulties, questions, or key takeaways here..." onchange="saveNotes(${module.id})">${moduleData.notes || ''}</textarea>
                        </div>

                        ${allTopicsCompleted && allPracticeCompleted ? `
                            <div class="milestone">
                                <h4>🎉 Module Complete!</h4>
                                <p>Great work! Move on to the next module.</p>
                            </div>
                        ` : ''}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function toggleModule(moduleId) {
            progress[moduleId].expanded = !progress[moduleId].expanded;
            const detailsElement = document.getElementById(`details-${moduleId}`);
            if (detailsElement) {
                detailsElement.classList.toggle('expanded');
            }
            saveProgress();
            // Re-render to update button rotation
            renderModules();
            updateDashboard();
        }

        function toggleTopic(moduleId, topicIdx) {
            const topics = progress[moduleId].completedTopics;
            if (topics.includes(topicIdx)) {
                topics.splice(topics.indexOf(topicIdx), 1);
            } else {
                topics.push(topicIdx);
            }
            saveProgress();
        }

        function togglePractice(moduleId, practiceIdx) {
            const practice = progress[moduleId].completedPractice;
            if (practice.includes(practiceIdx)) {
                practice.splice(practice.indexOf(practiceIdx), 1);
            } else {
                practice.push(practiceIdx);
            }
            saveProgress();
        }

        function saveNotes(moduleId) {
            progress[moduleId].notes = document.getElementById(`notes-${moduleId}`).value;
            saveProgress();
        }

        function updateDashboard() {
            let completed = 0, inProgress = 0, totalPractice = 0;
            let totalCompleted = 0;

            modules.forEach(module => {
                const data = progress[module.id];
                const allDone = data.completedTopics.length === module.topics.length && 
                               data.completedPractice.length === module.practiceItems.length;
                
                if (allDone) completed++;
                else if (data.completedTopics.length > 0 || data.completedPractice.length > 0) inProgress++;
                
                totalPractice += data.completedPractice.length;
                totalCompleted += data.completedTopics.length + data.completedPractice.length;
            });

            const totalItems = modules.reduce((sum, m) => sum + m.topics.length + m.practiceItems.length, 0);
            const overallPercent = Math.round(totalCompleted / totalItems * 100);

            document.getElementById('completedCount').textContent = completed;
            document.getElementById('inProgressCount').textContent = inProgress;
            document.getElementById('totalPractice').textContent = totalPractice;
            document.getElementById('overallPercent').textContent = overallPercent + '%';

            const progressBar = document.getElementById('overallBar');
            progressBar.style.width = overallPercent + '%';
            progressBar.textContent = overallPercent + '%';

            let detailText = `${totalCompleted}/${totalItems} items completed`;
            if (completed === 0 && inProgress === 0) {
                detailText = "Start your first module!";
            } else if (completed === modules.length) {
                detailText = "🎓 You've completed all modules! Time to specialize!";
            }
            document.getElementById('progressDetail').textContent = detailText;
        }

        function downloadProgress() {
            const data = {
                timestamp: new Date().toLocaleString(),
                progress: progress,
                stats: {
                    completedModules: Object.values(progress).filter(p => 
                        p.completedTopics.length === modules[Object.keys(progress).indexOf(Object.keys(progress).find(k => progress[k] === p))].topics.length &&
                        p.completedPractice.length === modules[Object.keys(progress).indexOf(Object.keys(progress).find(k => progress[k] === p))].practiceItems.length
                    ).length
                }
            };
            
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `engineering-math-progress-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }

        function resetProgress() {
            if (confirm('⚠️ Are you sure you want to reset all progress? This cannot be undone.')) {
                localStorage.removeItem('engineeringMathProgress');
                progress = loadProgress();
                modules.forEach(module => {
                    if (!progress[module.id]) {
                        progress[module.id] = {
                            status: 'not-started',
                            completedTopics: [],
                            completedPractice: [],
                            notes: ''
                        };
                    }
                });
                renderModules();
                updateDashboard();
            }
        }

        // Initial render
        renderModules();
        updateDashboard();
    </script>
</body>
</html>
